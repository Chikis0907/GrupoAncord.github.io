<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inicio de sesión</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
  <style>
    .login-card{max-width:420px;margin:0 auto}
  </style>
</head>
<body>
  <header class="header">
    <a href="index.html" class="logo-link" aria-label="Ir al inicio"><img src="img/groAncor.png" alt="logo" width="130" height="60"></a>
    <div class="header__right"></div>
  </header>

  <main class="container">
    <h1 class="mb-3">Panel de productos</h1>
    <div class="card login-card">
      <h2 class="h5 mb-3">Inicia sesión</h2>
      <form id="loginForm">
        <div class="mb-3">
          <label class="form-label" for="user">Usuario</label>
          <input id="user" class="form-control" type="text" placeholder="Usuario" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="pass">Contraseña</label>
          <input id="pass" class="form-control" type="password" placeholder="Contraseña" required>
        </div>
        <button class="btn" type="submit">Entrar</button>
        <div id="loginMsg" class="mt-2 text-danger small"></div>
      </form>
    </div>
  </main>

  <footer class="footer">
    <div class="contact">
      <div class="info">
        <h3 style="margin:0">Grupo Industrial Ancor</h3>
        <span>Derechos reservados · Copyright</span>
      </div>
    </div>
  </footer>

  <script>
    // Credenciales fijas
    const USER_OK = 'admin123';
    const PASS_OK = '12344321';

    document.getElementById('loginForm').addEventListener('submit', function(e){
      e.preventDefault();
      const u = document.getElementById('user').value.trim();
      const p = document.getElementById('pass').value.trim();
      const msg = document.getElementById('loginMsg');
      if (u === USER_OK && p === PASS_OK){
        // flag de sesión local (simple)
        sessionStorage.setItem('isLogged', '1');
        window.location.href = 'nuevoProducto.html';
      } else {
        msg.textContent = 'Usuario o contraseña incorrectos.';
      }
    });
  </script>
</body>
</html>
